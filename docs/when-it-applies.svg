<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d"><title id="t">When sbr-crystalizer.js changes the audio</title><desc id="d">It passes the audio through untouched unless the sample rate is 8 to 48 kilohertz, the clip is long enough, it contains speech, and a steep cutoff is found in the average spectrum or a manual cutoff is given. Only then does it rebuild the band above the cutoff.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.ok{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.no{fill:#2c1a1a;stroke:#8a4f4f;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6cf"/></marker></defs><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">When it changes the audio (and when it leaves it alone)</text>
  <rect class="box" x="20" y="50" width="150" height="52" rx="8"/><text x="95" y="73" text-anchor="middle" font-size="13.5" font-weight="600">Your channels</text><text class="dim" x="95" y="91" text-anchor="middle" font-size="11">Float32Array each</text><path class="arrow" d="M170,76 L200,76"/>
  <rect class="box" x="202" y="50" width="170" height="52" rx="8"/><text x="287" y="73" text-anchor="middle" font-size="13.5" font-weight="600">Rate 8-48 kHz?</text><text class="dim" x="287" y="91" text-anchor="middle" font-size="11">and at least 2 frames long</text><path class="arrow" d="M372,76 L402,76"/>
  <rect class="box" x="404" y="50" width="170" height="52" rx="8"/><text x="489" y="73" text-anchor="middle" font-size="13.5" font-weight="600">Speech present?</text><text class="dim" x="489" y="91" text-anchor="middle" font-size="11">not just silence or noise</text><path class="arrow" d="M574,76 L604,76"/>
  <rect class="box" x="606" y="50" width="134" height="52" rx="8"/><text x="673" y="73" text-anchor="middle" font-size="13.5" font-weight="600">Cutoff found?</text><text class="dim" x="673" y="91" text-anchor="middle" font-size="11">cliff, or manual</text>
  <path class="arrow" d="M287,102 L287,150"/><path class="arrow" d="M489,102 L489,150"/><path class="arrow" d="M673,102 L673,150"/>
  <rect class="no" x="202" y="152" width="170" height="52" rx="8"/><text x="287" y="175" text-anchor="middle" font-size="13.5" font-weight="600">No: unchanged</text><text class="dim" x="287" y="193" text-anchor="middle" font-size="11">applied: false</text><rect class="no" x="404" y="152" width="170" height="52" rx="8"/><text x="489" y="175" text-anchor="middle" font-size="13.5" font-weight="600">No: unchanged</text><text class="dim" x="489" y="193" text-anchor="middle" font-size="11">applied: false</text><rect class="no" x="606" y="152" width="134" height="52" rx="8"/><text x="673" y="175" text-anchor="middle" font-size="13.5" font-weight="600">No: unchanged</text><text class="dim" x="673" y="193" text-anchor="middle" font-size="11">full-band audio</text>
  
  <text class="dim" x="20" y="236" font-size="12">All three checks pass</text>
  <path class="arrow" d="M673,204 L673,252" style="stroke-dasharray:5 4"/>
  <rect class="ok" x="470" y="254" width="270" height="56" rx="8"/><text x="605" y="279" text-anchor="middle" font-size="13.5" font-weight="600">Yes: rebuild the band above the cutoff</text><text class="dim" x="605" y="297" text-anchor="middle" font-size="11">up to the taper end (default 14.9 kHz)</text>
  <text class="dim" x="20" y="342" font-size="11.5">Auto-detect needs a steep cutoff (at least 15 dB over about 375 Hz), as left by codecs and resampling.</text>
  <text class="dim" x="20" y="360" font-size="11.5">A gentle filter roll-off is not detected; give it the cutoff with { cutoffMode: 'manual', cutoffHz }.</text></svg>