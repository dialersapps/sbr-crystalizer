<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">How sbr-crystalizer.js processes a clip</title><desc id="d">Pass one analyses the whole clip: average spectrum, frame energies, cutoff. Pass two works frame by frame: the real spectrum below the cutoff is kept, a speech-shaped band is synthesised above it from the level under the cutoff, a tilt, a speech floor, the texture just below the cutoff and deterministic noise phases, gated by frame energy and tapered at the top, then an inverse FFT and overlap-add.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.ok{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.no{fill:#2c1a1a;stroke:#8a4f4f;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6cf"/></marker></defs><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">How it works</text>
  <text class="dim" x="20" y="52" font-size="12">Pass 1 - whole clip</text>
  <rect class="box" x="20" y="62" width="150" height="58" rx="8"/><text x="95" y="88" text-anchor="middle" font-size="13.5" font-weight="600">STFT analysis</text><text class="dim" x="95" y="106" text-anchor="middle" font-size="11">sqrt-Hann, 75% overlap</text><path class="arrow" d="M170,91 L206,91"/>
  <rect class="box" x="208" y="62" width="170" height="58" rx="8"/><text x="293" y="88" text-anchor="middle" font-size="13.5" font-weight="600">Average spectrum</text><text class="dim" x="293" y="106" text-anchor="middle" font-size="11">pooled over all channels</text><path class="arrow" d="M378,91 L414,91"/>
  <rect class="box" x="416" y="62" width="160" height="58" rx="8"/><text x="496" y="88" text-anchor="middle" font-size="13.5" font-weight="600">Find the cutoff</text><text class="dim" x="496" y="106" text-anchor="middle" font-size="11">steepest cliff, or manual</text><path class="arrow" d="M576,91 L612,91"/>
  <rect class="box" x="614" y="62" width="126" height="58" rx="8"/><text x="677" y="88" text-anchor="middle" font-size="13.5" font-weight="600">Frame energies</text><text class="dim" x="677" y="106" text-anchor="middle" font-size="11">for the noise gate</text>
  <text class="dim" x="20" y="154" font-size="12">Pass 2 - every frame</text>
  <rect class="box" x="20" y="164" width="150" height="58" rx="8"/><text x="95" y="190" text-anchor="middle" font-size="13.5" font-weight="600">Keep real spectrum</text><text class="dim" x="95" y="208" text-anchor="middle" font-size="11">everything below cutoff</text>
  <rect class="box" x="190" y="164" width="190" height="58" rx="8"/><text x="285" y="190" text-anchor="middle" font-size="13.5" font-weight="600">Level just under cutoff</text><text class="dim" x="285" y="208" text-anchor="middle" font-size="11">smoothed between frames</text><path class="arrow" d="M380,193 L406,193"/>
  <rect class="box" x="408" y="164" width="170" height="58" rx="8"/><text x="493" y="190" text-anchor="middle" font-size="13.5" font-weight="600">Extend upward</text><text class="dim" x="493" y="208" text-anchor="middle" font-size="11">tilt 11 dB/oct + speech floor</text><path class="arrow" d="M578,193 L604,193"/>
  <rect class="box" x="606" y="164" width="134" height="58" rx="8"/><text x="673" y="190" text-anchor="middle" font-size="13.5" font-weight="600">Shape + noise</text><text class="dim" x="673" y="208" text-anchor="middle" font-size="11">texture, hashed phases</text>
  <path class="arrow" d="M673,222 L673,246"/>
  <rect class="ok" x="470" y="248" width="270" height="58" rx="8"/><text x="605" y="274" text-anchor="middle" font-size="13.5" font-weight="600">Gate by frame energy, taper top</text><text class="dim" x="605" y="292" text-anchor="middle" font-size="11">no hiss in silence</text><path class="arrow" d="M470,277 L394,277"/>
  <rect class="ok" x="214" y="248" width="180" height="58" rx="8"/><text x="304" y="274" text-anchor="middle" font-size="13.5" font-weight="600">Inverse FFT</text><text class="dim" x="304" y="292" text-anchor="middle" font-size="11">overlap-add</text><path class="arrow" d="M214,277 L178,277"/>
  <rect class="ok" x="20" y="248" width="158" height="58" rx="8"/><text x="99" y="274" text-anchor="middle" font-size="13.5" font-weight="600">Output channels</text><text class="dim" x="99" y="292" text-anchor="middle" font-size="11">same rate (or 2x)</text></svg>